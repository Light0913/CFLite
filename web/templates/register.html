{% extends "base.html" %}
{% block title %}注册 · CFLite{% endblock %}
{% block content %}
<div class="center-page">
  <div class="card center-card">
    <div class="logo">CFLite</div>
    {% if not registration_enabled %}
      <div class="alert alert-error">⚠ 注册通道已关闭<br><span class="hint">{{ registration_reason }}，请联系管理员获取账号</span></div>
      <p class="hint">已有账号？<a href="/login">登录</a></p>
    {% else %}
      {% if error %}<div class="alert alert-error">{{ error }}</div>{% endif %}
      <form method="post" action="/api/register">
        <div class="form-group"><label>用户名</label><input type="text" name="username" required
          pattern="[a-zA-Z0-9_-]{1,32}" title="字母数字 _ -，长度 1-32"></div>
        <div class="form-group"><label>密码</label><input type="password" name="password" required minlength="6" maxlength="64"></div>
        <div class="form-group"><label>确认密码</label><input type="password" name="password_confirm" required></div>
        <button class="btn" type="submit" style="width:100%">注册</button>
      </form>
      <p class="hint">已有账号？<a href="/login">登录</a></p>
    {% endif %}
  </div>
</div>
{% endblock %}
