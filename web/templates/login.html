{% extends "base.html" %}
{% block title %}登录 · CFLite{% endblock %}
{% block content %}
<div class="center-page">
  <div class="card center-card">
    <div class="logo">CFLite</div>
    {% if error %}<div class="alert alert-error">{{ error }}</div>{% endif %}
    <form method="post" action="/api/login">
      <div class="form-group"><label>用户名</label><input type="text" name="username" required autofocus></div>
      <div class="form-group"><label>密码</label><input type="password" name="password" required></div>
      <button class="btn" type="submit" style="width:100%">登录</button>
    </form>
    <p class="hint" id="registration-status" data-enabled="{{ 'true' if registration_enabled else 'false' }}">
      {% if registration_enabled %}
        没有账号？<a href="/register">注册</a>
      {% else %}
        注册通道已关闭，请联系管理员
      {% endif %}
    </p>
  </div>
</div>
{% endblock %}
