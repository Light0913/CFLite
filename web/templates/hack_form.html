{% extends "base.html" %}
{% block title %}Hack 提交 #{{ target.id }} · CFLite{% endblock %}
{% block content %}
<div class="center-page">
  <div class="card" style="width:900px">
    <h2>Hack 提交 #{{ target.id }}</h2>
    <p class="hint">目标用户 #{{ target.user_id }} · 结果 {{ target.verdict|verdict_name }} · 语言 {{ target.language }}</p>
    <p><a href="/api/submissions/{{ target.id }}/source" target="_blank">查看目标代码</a></p>
    <hr>
    <form method="post" action="/api/problems/{{ pid }}/hack" enctype="multipart/form-data">
      <input type="hidden" name="sid" value="{{ target.id }}">
      <div class="form-group">
        <label>Hack 输入（直接粘贴，≤1MB）</label>
        <textarea name="input_text" rows="8" style="font-family:Consolas,monospace"></textarea>
      </div>
      <div class="form-group">
        <label>或上传输入文件</label>
        <input type="file" name="file">
      </div>
      <button class="btn btn-danger" type="submit">提交 Hack</button>
    </form>
  </div>
</div>
{% endblock %}
