id: demo
title: CFLite 演示赛
mode: score
start_at: 2026-01-01T00:00:00+08:00
end_at: 2030-12-31T23:59:59+08:00

registration:
  enabled: true
  close_at: "2030-12-31T23:00:00+08:00"
  min_password_length: 6
  max_password_length: 64

score:
  base_scores: {1001: 500, 1002: 750}
  duration_minutes: 120
  wrong_penalty: 50
  ignore_verdicts: [CE]
  decay:
    enabled: true
    type: linear
    floor_ratio: 0.3

rejudge:
  auto_trigger_after_contest: true
  concurrency: 4

hack:
  enabled: true
  successful_hack_points: 100
  unsuccessful_hack_penalty: 50
  invalid_input_penalty: 0
  validator_required: false
  merge_successful_into_system_tests: true

notifications:
  hack_notify: true
